---
layout: default
---

<div class="page-hero">
  <div class="page-hero__inner">
    {% if page.category %}
    <span class="page-hero__tag">{{ page.category }}</span>
    {% endif %}
    <h1 class="page-hero__title">{{ page.title }}</h1>
    <div class="page-hero__meta">
      {{ page.date | date: "%B %-d, %Y" }}
      {% if page.author %} &nbsp;·&nbsp; {{ page.author }}{% endif %}
    </div>
  </div>
</div>

<article class="post-content">
  {{ content }}
</article>
